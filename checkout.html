<h3>Checkout Page</h3>

<div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
    <h4>Payment Section</h4>
    <p>1. Cash on Delivery (COD) available.</p>
    <p>2. Pay via UPI:</p>
    <img src="qr.jpg" alt="QR Code" style="width:150px;">
    <p>UPI Number: 9876543210</p>
</div>

<label>Name:</label>
<input type="text" id="name" placeholder="Enter your name" style="width: 100%; padding: 10px; margin-bottom: 10px; display: block;">

<label>Address:</label>
<textarea id="address" placeholder="Enter your address" style="width: 100%; padding: 10px; margin-bottom: 20px; display: block;"></textarea>

<button onclick="sendWhatsApp()" style="background: #25D366; color: white; padding: 15px; width: 100%; border: none; cursor: pointer; border-radius: 5px; font-size: 16px;">
    Confirm Order on WhatsApp
</button>

<script>
    function sendWhatsApp() {
        let name = document.getElementById('name').value;
        let address = document.getElementById('address').value;
        if (name == "" || address == "") {
            alert("Please enter your name and address!");
            return;
        }
        let message = "New Order!%0A%0AName: " + name + "%0AAddress: " + address;
        let url = "https://wa.me/917708338592?text=" + message; 
        alert("Thank you " + name + "! Your order is confirmed.");
        window.open(url, '_blank');
    }
</script>
