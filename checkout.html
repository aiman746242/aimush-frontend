<!DOCTYPE html>
<html>
<head>
    <title>Checkout - Aimush</title>
</head>
<body style="font-family: sans-serif; padding: 20px; background-color: #f4f4f4;">

    <h1 style="text-align: center;">Checkout Page</h1>
    
    <div style="background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto;">
        <form>
            <label>Name:</label><br>
            <input type="text" placeholder="Enter your name" style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
            
            <label>Address:</label><br>
            <textarea placeholder="Enter your address" style="width: 100%; padding: 8px; margin-bottom: 20px;"></textarea>
        </form>

        <div style="border: 2px solid #ddd; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <h3>Payment Section</h3>
            <p>1. <b>Cash on Delivery (COD)</b> available.</p>
            <p>2. <b>Pay via UPI:</b></p>
            <img src="qr.jpg" alt="QR Code" width="150px">
            <p>UPI Number: 9876543210</p>
        </div>

        <input type="text" id="name" placeholder="Enter your name" style="width: 100%; padding: 8px; margin-bottom: 10px;">
<textarea id="address" placeholder="Enter your address" style="width: 100%; padding: 8px; margin-bottom: 20px;"></textarea>

<button onclick="sendWhatsApp()" style="background: #25D366; color: white; padding: 15px; width: 100%; border: none; cursor: pointer; border-radius: 5px;">
    Confirm Order on WhatsApp
</button>

<script>
    function sendWhatsApp() {
        let name = document.getElementById('name').value;
        let address = document.getElementById('address').value;
        let message = "New Order!%0A%0AName: " + name + "%0AAddress: " + address;
        // 91XXXXXxxxx ki jagah apna mobile number likhein
        let url = "https://wa.me/7708338592?text=" + message; 
        window.open(url, '_blank');
    }
</script>
    </div>

</body>
</html>
